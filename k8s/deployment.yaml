apiVersion: apps/v1
kind: Deployment
metadata:
  name: encontros-tech
  namespace: production
  labels:
    app: encontros-tech
    version: "2.0.0"
    component: api
  annotations:
    deployment.kubernetes.io/revision: "1"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: encontros-tech
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: encontros-tech
        version: "2.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30

      # Segurança no nível do Pod
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      # Anti-affinity: evita 2 pods no mesmo nó
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - encontros-tech
                topologyKey: kubernetes.io/hostname

      containers:
        - name: app
          image: docker.io/DOCKER_USERNAME/encontros-tech-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          # Variáveis de ambiente
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: encontros-tech-secrets
                  key: database_url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: encontros-tech-secrets
                  key: secret_key
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: encontros-tech-config
                  key: environment
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: encontros-tech-config
                  key: log_level
            - name: WORKERS
              valueFrom:
                configMapKeyRef:
                  name: encontros-tech-config
                  key: workers
            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: encontros-tech-config
                  key: app_name
            - name: APP_VERSION
              valueFrom:
                configMapKeyRef:
                  name: encontros-tech-config
                  key: version

          # Liveness probe — reinicia o pod se falhar
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          # Readiness probe — remove o pod do balanceador se falhar
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          # Startup probe — aguarda a app iniciar antes de ativar as outras probes
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12   # 60s total para iniciar

          # Limites de recursos
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          # Segurança no nível do container
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL

          # Volumes montados
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp

      volumes:
        - name: tmp-dir
          emptyDir: {}
