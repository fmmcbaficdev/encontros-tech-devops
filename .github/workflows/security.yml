# =============================================================================
# Encontros Tech — SAST Adicional (Segurança)
# Trigger: push/PR em main, schedule semanal (segunda 08h UTC)
# =============================================================================

name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1"   # toda segunda-feira às 08h UTC
  workflow_dispatch:        # permite execução manual

permissions:
  contents: read
  security-events: write

jobs:

  # -------------------------------------------------------------------------
  # Trivy — Scan de vulnerabilidades no filesystem e dependências Python
  # -------------------------------------------------------------------------
  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy — Scan completo (CRITICAL + HIGH)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: 0

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem

  # -------------------------------------------------------------------------
  # pip-audit — Dependências Python com CVEs
  # -------------------------------------------------------------------------
  pip-audit:
    name: pip-audit (Python deps)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit --quiet

      - name: Auditar dependências de produção
        run: |
          pip-audit \
            -r app/requirements.txt \
            --format json \
            --output pip-audit-prod.json \
            --skip-editable || true
          cat pip-audit-prod.json | python3 -m json.tool

      - name: Auditar dependências de desenvolvimento
        run: |
          pip-audit \
            -r app/requirements-dev.txt \
            --format json \
            --output pip-audit-dev.json \
            --skip-editable || true

      - name: Upload relatórios de auditoria
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-reports
          path: |
            pip-audit-prod.json
            pip-audit-dev.json
          retention-days: 30

  # -------------------------------------------------------------------------
  # Gitleaks — Detecta segredos expostos no código
  # -------------------------------------------------------------------------
  gitleaks:
    name: Gitleaks (secret detection)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (histórico completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
