[pytest]
# Diretório raiz dos testes
testpaths = tests

# Padrão de descoberta de arquivos de teste
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Flags padrão
addopts =
    -v
    --tb=short
    --strict-markers
    -q

# Marcadores customizados
markers =
    smoke: testes rápidos de sanidade (subconjunto para smoke test em CI)
    integration: testes que dependem de serviços externos
    slow: testes que demoram mais de 1 segundo

# Timeout padrão por teste (requer pytest-timeout)
# timeout = 30

# Modo asyncio (requer pytest-asyncio)
asyncio_mode = auto

# Relatório de cobertura (requer pytest-cov)
# Para ativar: pytest --cov=app --cov-report=xml --cov-report=term-missing
